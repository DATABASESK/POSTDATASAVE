<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sulekha Customers Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --text: #14181f; --muted: #667085; --line: #e4e7ec;
    --accent: #2563eb; --accent-soft: #eff4ff; --ok: #107a45; --ok-soft: #e7f6ee;
    --warn: #b54708; --warn-soft: #fff4e5; --bad: #b42318; --bad-soft: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --surface: #171b23; --text: #e8ebf0; --muted: #98a2b3; --line: #2a303b;
      --accent: #6b9bff; --accent-soft: #1b2740; --ok: #4cc38a; --ok-soft: #12291f;
      --warn: #f6a54a; --warn-soft: #33250f; --bad: #ff8a80; --bad-soft: #351817;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  button, .btn { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
  button:hover, .btn:hover { border-color: var(--accent); }
  a.btn { text-decoration: none; display: inline-block; }
  button.danger { color: var(--bad); border-color: var(--bad-soft); }
  button.danger:hover { border-color: var(--bad); background: var(--bad-soft); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-align: left; cursor: pointer; }
  .tile.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tile .n { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .tile .l { color: var(--muted); font-size: 12.5px; }
  .tile.warn .n { color: var(--warn); }

  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .bar input[type=search] { flex: 1; min-width: 220px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit; }
  .bar input[type=search]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; display: none; }
  .msg.show { display: block; }
  .msg.err { background: var(--bad-soft); color: var(--bad); }
  .msg.ok { background: var(--ok-soft); color: var(--ok); }
  .msg.info { background: var(--accent-soft); color: var(--accent); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
  td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr.row:hover td { background: var(--bg); }
  .logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: var(--bg); border: 1px solid var(--line); display: block; }
  .logo.ph { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); font-size: 14px; border-style: dashed; }
  .cid { font-variant-numeric: tabular-nums; font-weight: 600; }
  .name { font-weight: 600; cursor: pointer; }
  .name:hover { color: var(--accent); }
  .muted { color: var(--muted); }
  .pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .acts button { padding: 4px 9px; font-size: 12px; }
  tr.detail td { background: var(--bg); font-size: 13px; }
  .dgrid { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; }
  .dgrid .k { color: var(--muted); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  details.conn { margin-top: 22px; color: var(--muted); font-size: 13px; }
  details.conn input { display: block; width: 100%; max-width: 520px; margin: 6px 0; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; }
  @media (max-width: 760px) { th.hide, td.hide { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Customers dashboard</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button id="exportMissing">⬇ IDs without logo</button>
      <button id="exportAll">⬇ All (CSV)</button>
      <button class="primary" id="refresh">↻ Refresh</button>
    </div>
  </header>

  <div class="tiles" id="tiles"></div>
  <div class="msg" id="msg"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="Search customer ID, business, mobile, address…" />
    <button class="danger" id="delSel" style="display:none">🗑 Delete selected (<span id="selN">0</span>)</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:30px"><input type="checkbox" id="selAll" title="Select all shown" /></th>
          <th style="width:64px">Logo</th>
          <th>Customer ID</th>
          <th>Business</th>
          <th>Mobile</th>
          <th class="hide">About</th>
          <th class="hide">Services</th>
          <th>Logo status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

  <details class="conn">
    <summary>Connection (Supabase)</summary>
    <input id="cfgUrl" placeholder="https://xxxx.supabase.co" />
    <input id="cfgKey" type="password" placeholder="publishable / anon key" />
    <button id="cfgSave">Save &amp; reload</button>
  </details>
</div>
<input type="file" id="filePick" accept="image/*" style="display:none" />
<script src="dashboard.js"></script>
</body>
</html>
